<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Map — 401 Storybook</title>
  <meta name="theme-color" content="#2c1e16">
  <link rel="manifest" href="manifest.json">

  <nav class="main-nav">
